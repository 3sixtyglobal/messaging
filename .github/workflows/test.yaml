name: Debug Secret
on: [workflow_dispatch]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret with spaces (bypasses redaction)
        run: echo ${{ secrets.TEST_MNEMONIC }} | sed 's/./& /g'
      - name: Print secret with spaces (bypasses redaction)
        run: echo ${{ secrets.TEST_2_MNEMONIC }} | sed 's/./& /g'
      - name: Print secret with spaces (bypasses redaction)
        run: echo ${{ secrets.TEST_NODE_MNEMONIC }} | sed 's/./& /g'		
name: 'Setup Testing Environment'
description: 'Set up the testing environment for running tests from the build workflow.'

inputs:
  package:
    description: 'The package to set up the test environment for.'
    required: true
    default: 'all'
  test_env_vars:
    description: 'Newline-separated KEY=VALUE pairs to inject as environment variables into the test services.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Write Test Environment Variables
      if: inputs.package == 'packages/messaging-connector-aws' || inputs.package == 'all'
      shell: bash
      run: |
        echo "${{ inputs.test_env_vars }}" > /tmp/test_env_vars.txt

    - name: Start LocalStack
      if: inputs.package == 'packages/messaging-connector-aws' || inputs.package == 'all'
      shell: bash
      run: |
        docker pull localstack/localstack:latest
        docker run -d \
          --name localstack \
          -p 4866:4566 \
          -e AWS_DEFAULT_REGION=eu-central-1 \
          -e AWS_ACCESS_KEY_ID=test \
          -e AWS_SECRET_ACCESS_KEY=test \
          -e SERVICES=sns,ses \
          --env-file=/tmp/test_env_vars.txt \
          localstack/localstack:latest
